<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University of Calabar — Result Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="portal">

      <header class="portal-header">
        <img class="crest" src="unical-crest.png" alt="University of Calabar crest">
        <h1>UNIVERSITY OF CALABAR</h1>
        <div class="subtitle">RESULT PORTAL</div>
      </header>

      <main class="form-area">
        <form>
          <label for="matric">MATRICULATION NUMBER</label>
          <div class="input-wrap">
            <span class="icon card-icon"></span>
            <input id="matric" type="text" placeholder="e.g. CC/20/0001">
          </div>

          <label for="jamb">JAMB REGISTRATION NUMBER</label>
          <div class="input-wrap">
            <span class="icon hash-icon"></span>
            <input id="jamb" type="text" placeholder="e.g. 12345678AB">
          </div>

          <label for="pin">DATE OF PIN</label>
          <div class="input-wrap">
            <span class="icon calendar-icon"></span>
            <input id="pin" type="text" placeholder="Enter your pin">
          </div>

          <div class="student-buttons">
            <button type="button" class="secondary">
              <span class="button-icon"></span>
              NEW STUDENT
            </button>
            <button type="button" class="secondary">
              <span class="button-icon"></span>
              RETURNING
            </button>
          </div>

          <button type="submit" class="login">
            <span class="login-icon"></span>
            LOGIN
          </button>

          <div class="bottom-links">
            <a href="#" class="pin-link"><span></span> Don't have a pin? Get one here</a>
            <a href="#" class="change-link"><span>⟳</span> Change Pin</a>
          </div>
        </form>
      </main>

    </div>
  </div>
</body>
</html>
